# 只有标签推送才构建并发布：snapshot-* 为每 6 小时的进度快照，v* 为正式版。
name: Release (milestone)

on:
  push:
    tags:
      - 'snapshot-*'
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 直接用 GitHub runner 预装的 Android SDK（不再依赖 setup-android action）
      - name: Install SDK / NDK packages
        run: bash scripts/setup-android-sdk.sh

      - uses: gradle/actions/setup-gradle@v4

      - name: Build installable release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          LX_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          LX_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          LX_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE_BASE64" ]; then
            export LX_RELEASE_STORE_FILE="$RUNNER_TEMP/lxmusicc-signing.jks"
            trap 'rm -f "$LX_RELEASE_STORE_FILE"' EXIT
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$LX_RELEASE_STORE_FILE"
          else
            echo '::warning::未配置专用证书：使用调试证书签名，跨构建不保证覆盖更新。'
          fi
          ./scripts/build.sh --no-daemon :app:assembleRelease

      - name: Collect artifacts
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"
          mkdir -p dist
          cp "$apk" dist/lxmusicc.apk
          (cd dist && sha256sum lxmusicc.apk > SHA256SUMS)
          ls -l dist

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: ${{ startsWith(github.ref_name, 'snapshot-') }}
          body_path: docs/MILESTONE-LATEST.md
          fail_on_unmatched_files: true
          files: |
            dist/lxmusicc.apk
            dist/SHA256SUMS
